name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Explicit dispatch also works for branches pushed by GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, current master; explicit toolchain
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Install local SSH test prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server
          sudo install -d -m 0755 /run/sshd
      - name: Real loopback SSH integration tests
        if: runner.os == 'Linux'
        run: make test-ssh
      - name: Release validation orchestration regression tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -p 'test_release_validation.py'
      - name: Build release
        run: cargo build --release

  release-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.sh | sh
      - name: Validate prepared release plan (no hosting or publishing)
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          dist plan --tag "v$version"
