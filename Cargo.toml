[package]
name = "igara"
version = "0.1.0"
edition = "2024"
description = "Local-first CLI/TUI for linking workstations to remote Linux hosts"
license = "MIT"
repository = "https://github.com/lucaswilliameufrasio/igara"
rust-version = "1.99.1"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.34"
parking_lot = "0.13.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "serde_json"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "macros", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid7 = { version = "1.8.0", features = ["serde"] }
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
