[package]
name = "igara"
version = "0.1.0"
edition = "2024"
description = "Local-first CLI/TUI for linking workstations to remote Linux hosts"
license = "MIT"
repository = "https://github.com/lucaswilliameufrasio/igara"
rust-version = "1.94.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.32"
parking_lot = "0.12.5"
ratatui = "0.30.0"
rusqlite = { version = "0.38.0", features = ["bundled", "chrono", "serde_json"] }
rusqlite_migration = "2.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "process", "macros", "io-util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid7 = { version = "1.6.0", features = ["serde"] }
which = "8.0.0"

[dev-dependencies]
tempfile = "3.23.0"
